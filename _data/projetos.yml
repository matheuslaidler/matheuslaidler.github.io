# Configuração da página /projetos (renderizada do GitHub via JS — nome/descrição/stars sempre atualizados).
# Edite aqui pra curar. Forks e repos SEM descrição são escondidos automaticamente (a menos que estejam em "pinned").

github_user: matheuslaidler

# Repos a NÃO mostrar (mesmo tendo descrição):
exclude:
  - resoluesh
  - BRWIFI-Script

# FIXADOS no topo (com pino), nesta ordem. (cryptool não entra: já está no menu superior.)
pinned:
  - paperforge
  - ModernSidescrollerTemplate
  - PyckageTools-UFRJ

# Sobrescrever descrição/imagem de um repo específico (opcional):
# overrides:
#   nome-do-repo: { description: "texto melhor", image: "/assets/img/covers/proj-x.png" }
overrides: {}

# Itens MANUAIS — ex.: GitHub Projects (a API v2 de Projects exige token, então adicione à mão aqui).
# Cada item: { name, description, url, image (opcional), language (opcional), pinned (opcional), stars (opcional) }
extra: []
